services:
  - type: web
    name: pixelpeak-api
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PIXELPEAK_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.6
