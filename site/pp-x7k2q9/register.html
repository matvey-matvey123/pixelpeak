<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация — PixelPeak</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="favicon.ico" />
</head>
<body class="auth-page">
  <a class="brand center" href="index.html"><span class="logo">PP</span><span>PixelPeak</span></a>
  <form class="auth-card" id="registerForm">
    <h2>Создать аккаунт</h2>
    <p class="muted">Этот же аккаунт используется в лаунчере.</p>
    <label>Ник в игре<input type="text" name="username" placeholder="Steve_2026" autocomplete="username" required /></label>
    <label>Email<input type="email" name="email" placeholder="you@example.com" autocomplete="email" required /></label>
    <label>Пароль<input type="password" name="password" placeholder="минимум 6 символов" autocomplete="new-password" required /></label>
    <div class="form-msg" id="msg"></div>
    <button class="btn btn-primary big" type="submit">Зарегистрироваться</button>
    <p class="muted center-text">Уже есть аккаунт? <a href="login.html">Войти</a></p>
  </form>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
